refresh_rate = "30s"

[appenders.console]
kind = "console"

[appenders.console.encoder]
pattern = "[{d(%H:%M:%S)}] {h({l:<7})} [{t}] - {m}{n}"

[appenders.file]
kind = "file"
path = "log/log.log"

[appenders.file.encoder]
pattern = "{d(%Y-%m-%d %H:%M:%S)} {l:<7} {t} {f}:{L} - {m}{n}"

[root]
level = "debug"
appenders = ["console", "file"]

